name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Initialize Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Set execute permission for Gradle wrapper
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Rename and Prepare APK
        run: |
          mkdir -p release-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release-apk/Flows-v1.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flows-Android-APK
          path: release-apk/Flows-v1.0.0.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v1.0.0
          name: "Flows Android Mobile App v1.0.0"
          body: |
            ## 📱 Flows Mobile App (Android APK)
            
            Download and install the native **Flows Android App** directly onto your phone:
            
            - **Download APK:** [`Flows-v1.0.0.apk`](https://github.com/shaardul-18/flows/releases/download/v1.0.0/Flows-v1.0.0.apk)
            - **Direct Web / PWA version:** [https://shaardul-18.github.io/flows/](https://shaardul-18.github.io/flows/)
            
            ### How to Install on Android:
            1. Tap on `Flows-v1.0.0.apk` below to download.
            2. When prompted, tap **Install** (or allow "Install from unknown sources" in Chrome).
            3. Open Flows from your home screen and start tracking!
          files: release-apk/Flows-v1.0.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
